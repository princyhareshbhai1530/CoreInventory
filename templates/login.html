<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Inventify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background: #020617;
      display: flex;
      overflow: hidden;
    }

    /* ── Canvas background ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Left panel ── */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      padding: 48px;
      min-height: 100vh;
    }

    .brand-area {
      text-align: center;
      animation: fadeUp 0.8s ease both;
    }

    .brand-logo {
      width: 90px; height: 90px;
      border-radius: 24px;
      overflow: hidden;
      display: inline-flex;
      margin-bottom: 20px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 8px 32px rgba(0,0,0,0.5);
    }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .brand-name {
      font-size: 42px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -1.5px;
      line-height: 1;
      margin-bottom: 10px;
    }
    .brand-name span {
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-tagline {
      font-size: 15px;
      color: rgba(255,255,255,0.4);
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .brand-pills {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 28px;
      flex-wrap: wrap;
    }
    .brand-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 100px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      font-weight: 500;
      backdrop-filter: blur(8px);
    }
    .brand-pill i { color: #10b981; font-size: 13px; }

    /* ── Right panel ── */
    .right-panel {
      width: 460px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 40px;
      position: relative;
      z-index: 2;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(24px);
      border-left: 1px solid rgba(255,255,255,0.06);
    }

    .login-box {
      width: 100%;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    /* Logo small inside card */
    .card-logo {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 32px;
    }
    .card-logo-img {
      width: 40px; height: 40px; border-radius: 10px;
      overflow: hidden; flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
    }
    .card-logo-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-logo-text { font-size: 18px; font-weight: 800; color: #f1f5f9; letter-spacing: -0.5px; }
    .card-logo-sub  { font-size: 11px; color: #475569; font-weight: 500; margin-top: 1px; }

    .login-heading {
      font-size: 26px;
      font-weight: 800;
      color: #f1f5f9;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 13px;
      color: #475569;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* Fields */
    .field-group { margin-bottom: 18px; }
    .field-group label {
      display: block; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.7px;
      color: #475569; margin-bottom: 7px;
    }
    .field-wrap { position: relative; }
    .field-wrap i.field-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: #334155; font-size: 15px; pointer-events: none;
      transition: color 0.15s;
    }
    .field-wrap input {
      width: 100%; padding: 12px 14px 12px 42px;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: #f1f5f9; outline: none;
      transition: all 0.2s;
    }
    .field-wrap input:focus {
      border-color: #10b981;
      background: rgba(16,185,129,0.05);
      box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
    }
    .field-wrap input:focus ~ i.field-icon,
    .field-wrap input:focus + i.field-icon { color: #10b981; }
    .field-wrap input::placeholder { color: #334155; }

    .pw-toggle {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      cursor: pointer; color: #334155;
      font-size: 15px; transition: color 0.15s;
      background: none; border: none; padding: 0;
    }
    .pw-toggle:hover { color: #64748b; }

    /* Error */
    .auth-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 9px; padding: 10px 14px;
      font-size: 13px; color: #fca5a5;
      margin-bottom: 18px; display: none;
      align-items: center; gap: 8px;
    }

    /* Button */
    .btn-signin {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer; margin-top: 6px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(16,185,129,0.35);
      letter-spacing: 0.3px;
    }
    .btn-signin:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16,185,129,0.45);
    }
    .btn-signin:active { transform: scale(0.98); }
    .btn-signin:disabled {
      background: rgba(255,255,255,0.06);
      color: #475569; cursor: not-allowed;
      box-shadow: none;
    }

    /* Links */
    .auth-links {
      text-align: center; margin-top: 22px;
      font-size: 13px; color: #334155;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .auth-links a { color: #10b981; font-weight: 600; text-decoration: none; transition: color 0.15s; }
    .auth-links a:hover { color: #6ee7b7; }
    .auth-links .sep { color: #1e293b; }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0;
    }
    .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
    .divider-text { font-size: 11px; color: #334155; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Spin */
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .left-panel { display: none; }
      .right-panel {
        width: 100%; border-left: none;
        background: #020617;
        backdrop-filter: none;
      }
    }
  </style>
</head>
<body>

<!-- Animated canvas background -->
<canvas id="bg-canvas"></canvas>

<!-- Left panel — brand + motion trails -->
<div class="left-panel">
  <div class="brand-area">
    <div class="brand-logo">
      <img src="/static/img/inventify_logo.jpeg" alt="Inventify">
    </div>
    <div class="brand-name">Invent<span>ify</span></div>
    <div class="brand-tagline">AI-Powered Inventory Management</div>
    <div class="brand-pills">
      <div class="brand-pill"><i class="bi bi-cpu-fill"></i> AI Analytics</div>
      <div class="brand-pill"><i class="bi bi-lightning-fill"></i> Real-time Sync</div>
      <div class="brand-pill"><i class="bi bi-shield-fill-check"></i> Secure</div>
      <div class="brand-pill"><i class="bi bi-boxes"></i> Multi-warehouse</div>
    </div>
  </div>
</div>

<!-- Right panel — login form -->
<div class="right-panel">
  <div class="login-box">

    <div class="card-logo">
      <div class="card-logo-img">
        <img src="/static/img/inventify_logo.jpeg" alt="Inventify">
      </div>
      <div>
        <div class="card-logo-text">Inventify</div>
        <div class="card-logo-sub">AI Inventory OS</div>
      </div>
    </div>

    <div class="login-heading">Welcome back</div>
    <div class="login-sub">Sign in to your account to continue.</div>

    <div class="auth-error" id="login-error">
      <i class="bi bi-exclamation-circle-fill"></i>
      <span id="login-error-text"></span>
    </div>

    <div class="field-group">
      <label>Login ID</label>
      <div class="field-wrap">
        <input type="text" id="login-id" placeholder="Enter your login ID"
               maxlength="12" autocomplete="username">
        <i class="bi bi-person field-icon"></i>
      </div>
    </div>

    <div class="field-group">
      <label>Password</label>
      <div class="field-wrap">
        <input type="password" id="login-password" placeholder="Enter your password"
               autocomplete="current-password"
               onkeydown="if(event.key==='Enter') doLogin()">
        <i class="bi bi-lock field-icon"></i>
        <button class="pw-toggle" onclick="togglePw()" type="button" id="pw-toggle-btn">
          <i class="bi bi-eye-slash" id="pw-eye"></i>
        </button>
      </div>
    </div>

    <div style="text-align:right;margin-top:-10px;margin-bottom:20px;">
      <a href="/forgot-password" style="font-size:12px;color:#475569;text-decoration:none;font-weight:500;transition:color 0.15s;"
         onmouseover="this.style.color='#10b981'" onmouseout="this.style.color='#475569'">
        Forgot password?
      </a>
    </div>

    <button class="btn-signin" id="signin-btn" onclick="doLogin()">
      <i class="bi bi-box-arrow-in-right"></i> Sign In
    </button>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">New to Inventify?</div>
      <div class="divider-line"></div>
    </div>

    <div class="auth-links">
      <a href="/signup" style="width:100%;padding:11px;text-align:center;border:1.5px solid rgba(255,255,255,0.08);border-radius:10px;display:block;font-size:14px;color:#94a3b8;background:rgba(255,255,255,0.03);transition:all 0.2s;"
         onmouseover="this.style.borderColor='#10b981';this.style.color='#10b981'"
         onmouseout="this.style.borderColor='rgba(255,255,255,0.08)';this.style.color='#94a3b8'">
        Create an account
      </a>
    </div>

  </div>
</div>

<script>
// ── LOGIN ─────────────────────────────────────────
async function doLogin() {
  const btn      = document.getElementById('signin-btn');
  const errorBox = document.getElementById('login-error');
  const loginId  = document.getElementById('login-id').value.trim();
  const password = document.getElementById('login-password').value;

  errorBox.style.display = 'none';
  if (!loginId)  return showErr('Please enter your Login ID.');
  if (!password) return showErr('Please enter your password.');

  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Signing in...';

  try {
    const res  = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ login_id: loginId, password }),
    });
    const data = await res.json();
    if (!res.ok) return showErr(data.error || 'Invalid Login ID or Password.');
    window.location.href = '/';
  } catch(e) {
    showErr('Server error. Make sure the app is running.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
  }
}

function showErr(msg) {
  const box = document.getElementById('login-error');
  document.getElementById('login-error-text').textContent = msg;
  box.style.display = 'flex';
}

function togglePw() {
  const inp = document.getElementById('login-password');
  const eye = document.getElementById('pw-eye');
  const isText = inp.type === 'text';
  inp.type = isText ? 'password' : 'text';
  eye.className = isText ? 'bi bi-eye-slash' : 'bi bi-eye';
}

// ── MOTION TRAILS CANVAS ─────────────────────────
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');

let W, H, particles = [], trails = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Color palette — emerald, cyan, blue, purple
const COLORS = [
  'rgba(16,185,129,',    // emerald
  'rgba(6,182,212,',     // cyan
  'rgba(59,130,246,',    // blue
  'rgba(139,92,246,',    // purple
  'rgba(20,220,150,',    // mint
];

class Particle {
  constructor() { this.reset(true); }

  reset(init = false) {
    this.x     = Math.random() * W;
    this.y     = init ? Math.random() * H : H + 20;
    this.vx    = (Math.random() - 0.5) * 0.6;
    this.vy    = -(Math.random() * 1.2 + 0.4);
    this.size  = Math.random() * 2.5 + 1;
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.alpha = Math.random() * 0.7 + 0.3;
    this.life  = 0;
    this.maxLife = Math.random() * 200 + 150;
    this.trail = [];
    this.trailLen = Math.floor(Math.random() * 60 + 30);
    // Subtle wave
    this.wave  = Math.random() * Math.PI * 2;
    this.waveAmp = Math.random() * 0.4;
    this.waveFreq = Math.random() * 0.03 + 0.01;
  }

  update() {
    this.wave += this.waveFreq;
    this.vx += Math.sin(this.wave) * this.waveAmp * 0.05;
    this.x += this.vx;
    this.y += this.vy;
    this.life++;

    // Push to trail
    this.trail.push({ x: this.x, y: this.y, a: this.alpha });
    if (this.trail.length > this.trailLen) this.trail.shift();

    if (this.life > this.maxLife || this.y < -20) this.reset();
  }

  draw() {
    if (this.trail.length < 2) return;

    // Draw trail as gradient line
    for (let i = 1; i < this.trail.length; i++) {
      const t    = i / this.trail.length;
      const prev = this.trail[i - 1];
      const curr = this.trail[i];
      const a    = t * this.alpha * 0.8;

      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(curr.x, curr.y);
      ctx.strokeStyle = this.color + a + ')';
      ctx.lineWidth   = this.size * t;
      ctx.lineCap     = 'round';
      ctx.stroke();
    }

    // Glow head
    const head = this.trail[this.trail.length - 1];
    const grd  = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, this.size * 4);
    grd.addColorStop(0, this.color + this.alpha + ')');
    grd.addColorStop(1, this.color + '0)');
    ctx.beginPath();
    ctx.arc(head.x, head.y, this.size * 4, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
  }
}

// Floating orbs — large soft glows
class Orb {
  constructor() {
    this.x     = Math.random() * W;
    this.y     = Math.random() * H;
    this.r     = Math.random() * 180 + 80;
    this.vx    = (Math.random() - 0.5) * 0.15;
    this.vy    = (Math.random() - 0.5) * 0.15;
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.alpha = Math.random() * 0.06 + 0.02;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.x < -this.r) this.x = W + this.r;
    if (this.x > W + this.r) this.x = -this.r;
    if (this.y < -this.r) this.y = H + this.r;
    if (this.y > H + this.r) this.y = -this.r;
  }
  draw() {
    const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
    grd.addColorStop(0, this.color + this.alpha + ')');
    grd.addColorStop(1, this.color + '0)');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
  }
}

// Init
const PARTICLE_COUNT = 60;
const ORB_COUNT      = 5;

for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
const orbs = Array.from({ length: ORB_COUNT }, () => new Orb());

// Animate
function animate() {
  ctx.clearRect(0, 0, W, H);

  // Dark base
  ctx.fillStyle = '#020617';
  ctx.fillRect(0, 0, W, H);

  // Orbs
  orbs.forEach(o => { o.update(); o.draw(); });

  // Particles + trails
  particles.forEach(p => { p.update(); p.draw(); });

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
