<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — Inventify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container { width: 100%; max-width: 440px; }

    .app-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-box {
      width: 68px; height: 68px;
      background: #fff;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      overflow: hidden;
      padding: 0;
    }
    .logo-box img {
      width: 68px; height: 68px;
      object-fit: cover;
      display: block;
      border-radius: 16px;
    }

    .logo-title {
      display: block;
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .logo-sub {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }

    .auth-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px 28px;
    }

    .auth-card h2 {
      font-size: 19px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .auth-card .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .field-group { margin-bottom: 14px; }

    .field-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .field-group input {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: #f1f5f9;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field-group input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.12);
    }

    .field-group input::placeholder { color: #475569; }
    .field-group input.error { border-color: #ef4444; }
    .field-group input.ok    { border-color: #10b981; }

    /* Password strength hints */
    .pw-rules {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .pw-rule {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #64748b;
      transition: all 0.2s;
    }

    .pw-rule.met {
      background: rgba(16,185,129,0.1);
      border-color: #10b981;
      color: #10b981;
    }

    .btn-signup {
      width: 100%;
      padding: 12px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-signup:hover  { background: #059669; }
    .btn-signup:active { transform: scale(0.98); }
    .btn-signup:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    .auth-links {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #64748b;
    }

    .auth-links a {
      color: #10b981;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-links a:hover { text-decoration: underline; }

    .auth-error {
      background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #dc2626;
      margin-bottom: 14px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .auth-success {
      background: #d1fae5;
      border: 1px solid #a7f3d0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #065f46;
      margin-bottom: 14px;
      display: none;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

<div class="auth-container">

  <!-- App Logo -->
  <div class="app-logo">
    <div class="logo-box">
      <img src="/static/img/inventify_logo.jpeg" alt="Inventify Logo">
    </div>
    <span class="logo-title">Inventify</span>
    <span class="logo-sub">Create your account</span>
  </div>

  <!-- Signup Card -->
  <div class="auth-card">
    <h2>Sign Up</h2>
    <p class="subtitle">
      Login ID: 6–12 characters · Password: 8+ chars with uppercase, lowercase &amp; special character
    </p>

    <div class="auth-error" id="signup-error">
      <i class="bi bi-x-circle-fill"></i>
      <span id="signup-error-text"></span>
    </div>

    <div class="auth-success" id="signup-success">
      <i class="bi bi-check-circle-fill"></i>
      <span>Account created! Redirecting to dashboard...</span>
    </div>

    <div class="field-group">
      <label>Enter Login ID</label>
      <input type="text" id="su-loginid" placeholder="6–12 characters"
             minlength="6" maxlength="12" oninput="validateLoginId(this)">
    </div>

    <div class="field-group">
      <label>Enter Email ID</label>
      <input type="email" id="su-email" placeholder="you@example.com"
             oninput="validateEmail(this)">
    </div>

    <div class="field-group">
      <label>Enter Password</label>
      <input type="password" id="su-password" placeholder="Min 8 characters"
             oninput="validatePassword(this)">
      <div class="pw-rules">
        <span class="pw-rule" id="rule-len">8+ chars</span>
        <span class="pw-rule" id="rule-upper">Uppercase</span>
        <span class="pw-rule" id="rule-lower">Lowercase</span>
        <span class="pw-rule" id="rule-special">Special char</span>
      </div>
    </div>

    <div class="field-group">
      <label>Re-Enter Password</label>
      <input type="password" id="su-confirm" placeholder="Repeat your password"
             oninput="validateConfirm(this)"
             onkeydown="if(event.key==='Enter') doSignup()">
    </div>

    <button class="btn-signup" id="signup-btn" onclick="doSignup()">
      <i class="bi bi-person-plus-fill"></i> SIGN UP
    </button>

    <div class="auth-links">
      Already have an account? <a href="/login">Sign In</a>
    </div>
  </div>

</div>

<script>
  // ── Live validation helpers ─────────────────────
  function validateLoginId(el) {
    const v = el.value.trim();
    el.classList.toggle('ok',    v.length >= 6 && v.length <= 12);
    el.classList.toggle('error', v.length > 0 && (v.length < 6 || v.length > 12));
  }

  function validateEmail(el) {
    const ok = el.value.includes('@') && el.value.includes('.');
    el.classList.toggle('ok',    ok);
    el.classList.toggle('error', el.value.length > 0 && !ok);
  }

  function validatePassword(el) {
    const v = el.value;
    const rules = {
      'rule-len':     v.length >= 8,
      'rule-upper':   /[A-Z]/.test(v),
      'rule-lower':   /[a-z]/.test(v),
      'rule-special': /[!@#$%^&*(),.?":{}|<>_\-]/.test(v),
    };
    Object.entries(rules).forEach(([id, met]) => {
      document.getElementById(id).classList.toggle('met', met);
    });
    const allMet = Object.values(rules).every(Boolean);
    el.classList.toggle('ok',    allMet);
    el.classList.toggle('error', v.length > 0 && !allMet);
    // Also re-check confirm
    validateConfirm(document.getElementById('su-confirm'));
  }

  function validateConfirm(el) {
    const pw = document.getElementById('su-password').value;
    if (!el.value) { el.classList.remove('ok','error'); return; }
    el.classList.toggle('ok',    el.value === pw);
    el.classList.toggle('error', el.value !== pw);
  }

  // ── Sign up submit ──────────────────────────────
  async function doSignup() {
    const btn      = document.getElementById('signup-btn');
    const errorBox = document.getElementById('signup-error');
    const errorTxt = document.getElementById('signup-error-text');
    const success  = document.getElementById('signup-success');

    errorBox.style.display  = 'none';
    success.style.display   = 'none';

    const loginId = document.getElementById('su-loginid').value.trim();
    const email   = document.getElementById('su-email').value.trim();
    const pw      = document.getElementById('su-password').value;
    const confirm = document.getElementById('su-confirm').value;

    // Client-side quick checks
    if (!loginId) { showErr('Login ID is required.'); return; }
    if (loginId.length < 6 || loginId.length > 12) { showErr('Login ID must be 6–12 characters.'); return; }
    if (!email || !email.includes('@')) { showErr('Enter a valid email address.'); return; }
    if (!pw) { showErr('Password is required.'); return; }
    if (pw !== confirm) { showErr('Passwords do not match.'); return; }

    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Creating account...';

    try {
      const res  = await fetch('/api/signup', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          login_id:         loginId,
          email:            email,
          password:         pw,
          confirm_password: confirm,
        }),
      });
      const data = await res.json();

      if (!res.ok) {
        showErr(data.error || 'Signup failed. Please try again.');
        return;
      }

      // Success
      success.style.display = 'flex';
      setTimeout(() => window.location.href = '/', 1200);

    } catch (e) {
      showErr('Server error. Make sure the app is running.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-person-plus-fill"></i> SIGN UP';
    }
  }

  function showErr(msg) {
    const box = document.getElementById('signup-error');
    document.getElementById('signup-error-text').textContent = msg;
    box.style.display = 'flex';
  }
</script>

</body>
</html>
